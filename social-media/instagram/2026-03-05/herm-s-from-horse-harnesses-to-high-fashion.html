<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Instagram Post — Hermès: From Horse Harnesses to High Fashion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Source Sans 3', sans-serif;
    position: relative;
  }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
  }

  .post__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .post__overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(26, 26, 46, 0.95) 0%,
      rgba(26, 26, 46, 0.75) 35%,
      rgba(26, 26, 46, 0.15) 60%,
      rgba(26, 26, 46, 0.05) 100%
    );
  }

  .post__content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 60px;
    color: #fff;
  }

  .post__category {
    display: inline-block;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c9a96e;
    margin-bottom: 20px;
    border-bottom: 2px solid #c9a96e;
    padding-bottom: 8px;
  }

  .post__title {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.15;
    color: #ffffff;
    margin-bottom: 20px;
    max-width: 900px;
  }

  .post__description {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 300;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 30px;
    max-width: 850px;
  }

  .post__footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(201, 169, 110, 0.4);
    padding-top: 20px;
  }

  .post__brand {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #c9a96e;
    letter-spacing: 1px;
  }

  .post__date {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 1px;
  }

  .post__read-time {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
  }

  .post__corner-accent {
    position: absolute;
    top: 40px;
    right: 40px;
    width: 60px;
    height: 60px;
    border-top: 3px solid #c9a96e;
    border-right: 3px solid #c9a96e;
  }

  .post__corner-accent--bottom {
    top: auto;
    right: auto;
    bottom: 40px;
    left: 40px;
    border-top: none;
    border-right: none;
    border-bottom: 3px solid #c9a96e;
    border-left: 3px solid #c9a96e;
  }
</style>
</head>
<body>
  <div class="post">
    <img class="post__image" src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=1080&h=1080&fit=crop" alt="A horse in golden light — the animal at the heart of Hermès' heritage">
    <div class="post__overlay"></div>
    <div class="post__corner-accent"></div>
    <div class="post__corner-accent post__corner-accent--bottom"></div>
    <div class="post__content">
      <span class="post__category">Equestrian Heritage</span>
      <h1 class="post__title">Hermès: From Horse Harnesses to High Fashion</h1>
      <p class="post__description">How a small harness workshop in Paris became the most desired luxury brand in the world — and never forgot the horse that started it all.</p>
      <div class="post__footer">
        <span class="post__brand">The Rider's Gang</span>
        <span class="post__date">March 5, 2026</span>
        <span class="post__read-time">5 min read</span>
      </div>
    </div>
  </div>
</body>
</html>
