<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" fill="none">
  <!-- Horse silhouette (left) -->
  <g transform="translate(95, 80) scale(0.7)" fill="#c9a96e">
    <!-- Horse body rearing -->
    <path d="M40 120 C35 105 25 85 20 65 C18 55 20 40 28 30 C33 23 38 18 42 12 C45 7 46 0 45 -8 C48 -3 50 5 48 13 C52 10 57 11 59 15 C56 17 53 19 51 22 C55 24 58 30 56 38 C54 43 50 46 47 48 C52 50 56 57 54 67 C52 76 47 84 43 92 C47 97 52 105 56 115 C58 120 60 128 58 135 C56 140 53 142 50 140 C49 137 50 132 51 127 C52 122 51 117 48 112 C45 107 42 103 40 100 Z"/>
    <!-- Front legs raised -->
    <path d="M25 45 C20 36 13 24 8 15 C6 11 7 9 10 10 C13 13 18 22 23 32 C25 36 27 41 26 45 Z"/>
    <path d="M35 40 C31 30 26 20 22 12 C20 9 22 7 24 8 C27 11 31 20 35 30 C36 34 37 38 36 42 Z"/>
    <!-- Hind legs -->
    <path d="M48 110 C51 120 54 132 56 142 C56 145 54 148 52 146 C50 143 50 137 49 130 C48 122 47 116 46 110 Z"/>
    <path d="M38 100 C34 112 30 126 27 138 C26 142 28 145 30 143 C31 140 32 133 34 125 C36 117 38 110 39 104 Z"/>
    <!-- Tail -->
    <path d="M54 70 C61 64 70 62 76 67 C80 71 78 77 73 75 C69 73 64 70 60 73 C57 76 55 80 53 85 C53 80 53 75 54 70 Z"/>
    <!-- Mane -->
    <path d="M42 12 C38 8 33 9 30 15 C33 10 37 8 41 7 Z" opacity="0.6"/>
  </g>

  <!-- Motorcycle silhouette (right) -->
  <g transform="translate(145, 92) scale(0.65)" fill="#c9a96e">
    <!-- Rear wheel -->
    <circle cx="25" cy="85" r="28" fill="none" stroke="#c9a96e" stroke-width="5"/>
    <circle cx="25" cy="85" r="8" fill="#c9a96e"/>
    <!-- Front wheel -->
    <circle cx="145" cy="85" r="28" fill="none" stroke="#c9a96e" stroke-width="5"/>
    <circle cx="145" cy="85" r="8" fill="#c9a96e"/>
    <!-- Frame -->
    <path d="M45 80 L80 40 L110 40 L145 75" stroke="#c9a96e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 40 L55 80" stroke="#c9a96e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M95 40 L75 80" stroke="#c9a96e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Engine block -->
    <rect x="58" y="55" width="30" height="22" rx="3" fill="#c9a96e"/>
    <!-- Seat -->
    <path d="M62 38 C68 32 90 30 105 35" stroke="#c9a96e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Handlebars -->
    <path d="M110 40 L120 28 M110 40 L125 32" stroke="#c9a96e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Front fork -->
    <path d="M115 42 L145 80" stroke="#c9a96e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Exhaust -->
    <path d="M50 78 L30 85" stroke="#c9a96e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Tank -->
    <ellipse cx="88" cy="38" rx="14" ry="7" fill="#c9a96e"/>
    <!-- Headlight -->
    <circle cx="140" cy="55" r="5" fill="#c9a96e"/>
  </g>

  <!-- Divider line -->
  <line x1="70" y1="195" x2="230" y2="195" stroke="#c9a96e" stroke-width="1.5" opacity="0.5"/>

  <!-- THE RIDERS GANG text -->
  <text x="150" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#c9a96e" text-anchor="middle" letter-spacing="5">THE RIDERS</text>
  <text x="150" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#c9a96e" text-anchor="middle" letter-spacing="8">GANG</text>
</svg>