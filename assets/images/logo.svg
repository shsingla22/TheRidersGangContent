<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer Shield -->
  <path d="M200 12 L370 80 L370 220 C370 300 290 370 200 392 C110 370 30 300 30 220 L30 80 Z" fill="#1a1a2e" stroke="#c9a96e" stroke-width="6"/>
